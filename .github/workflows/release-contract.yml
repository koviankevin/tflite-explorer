name: Release contract gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/release*'
      - 'package*.json'
      - '.github/workflows/release-contract.yml'
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REPORT_NAME: release-contract-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Require release integrity and gate rejection cases
        run: node scripts/accept-release-contract.mjs --out "$RUNNER_TEMP/$REPORT_NAME"
      - name: Retain bounded source-bound report, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.REPORT_NAME }}
          if-no-files-found: error
          retention-days: 30
