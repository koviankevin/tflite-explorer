name: Public site browser smoke
on:
  workflow_dispatch:
    inputs:
      expected_build_id:
        description: Exact build ID already served by the public site
        type: string
        required: true
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node test/browser/production-smoke.mjs
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build_id }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke
          path: |
            ${{ runner.temp }}/production-smoke.json
            ${{ runner.temp }}/production-smoke.png
          if-no-files-found: error
          retention-days: 30
