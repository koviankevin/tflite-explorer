name: Public site browser smoke
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Public production check or isolated versioned upgrade/rollback
        type: choice
        options: [production, versioned, keyboard]
        default: production
      expected_build_id:
        description: Exact build ID already served by the public site
        type: string
        required: true
permissions:
  contents: read
jobs:
  public-smoke:
    if: ${{ inputs.scenario != 'versioned' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: node scripts/install-browser.mjs
      - run: node test/browser/production-smoke.mjs
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build_id }}
          KEYBOARD_AUDIT: ${{ inputs.scenario == 'keyboard' }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke
          path: |
            ${{ runner.temp }}/production-smoke.json
            ${{ runner.temp }}/production-smoke.png
          if-no-files-found: error
          retention-days: 30
  site-upgrade:
    if: ${{ inputs.scenario == 'versioned' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: node scripts/install-browser.mjs
      - id: switching
        run: node test/browser/versioned-site.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node test/browser/production-smoke.mjs
        env:
          MODEL_LENS_SMOKE_DIRECTORY: ${{ steps.switching.outputs.snapshot_directory }}
          EXPECTED_BUILD: ${{ steps.switching.outputs.snapshot_build_id }}
          EXPECTED_SITE_ID: ${{ steps.switching.outputs.snapshot_site_id }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versioned-delivery-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-smoke.json
            ${{ runner.temp }}/production-smoke.png
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versioned-site-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/versioned-site-browser.json
            ${{ runner.temp }}/versioned-site-browser.png
          if-no-files-found: error
          retention-days: 30
