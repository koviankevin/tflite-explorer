name: Optional large-file Chromium acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  large-file:
    # Playwright 1.56.1 supports this image; ubuntu-latest can advance.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:large-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-file-chromium-report
          path: test-results/large-file.json
          if-no-files-found: error
          retention-days: 14
