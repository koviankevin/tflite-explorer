name: Physical native memory attribution diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-memory-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.repository == 'koviankevin/tflite-explorer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_NAME: browser-memory-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check anchored observations, PID guards and unchanged lifecycle rules
        run: node --test test/lifecycle-memory-diagnostics.test.mjs test/owned-processes.test.mjs test/browser-lifecycle.test.mjs test/physical-fixture.test.mjs
      - run: node scripts/install-browser.mjs
      - name: One readonly native attribution run using the original eight-cycle policy
        run: LIFECYCLE_MODE=memory-diagnostic LIFECYCLE_REPORT="$RUNNER_TEMP/$REPORT_NAME" node test/browser/model-lifecycle.mjs
      - name: Retain diagnostic metadata and original failures, never model files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-memory-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.REPORT_NAME }}
          if-no-files-found: error
          retention-days: 30
