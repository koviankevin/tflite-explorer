name: Large manual edit draft recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/large-edit-draft.yml'
      - 'test/browser/large-edit-draft.mjs'
      - 'test/browser/manual-draft-audit.mjs'
      - 'test/manual-draft-audit.test.mjs'
permissions:
  contents: read
concurrency:
  group: large-edit-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  large-edit-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRAFT_REPORT: ${{ runner.temp }}/large-edit-draft.json
      DRAFT_SCREENSHOT: ${{ runner.temp }}/large-edit-draft.png
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/manual-draft-audit.test.mjs test/model-edit-session.test.mjs
      - run: node scripts/install-browser.mjs
      - name: Physical 1.25 GiB JSON download, cancel, native restore and export
        run: node test/browser/large-edit-draft.mjs
      - name: Retain bounded evidence and failure screenshot, never model or draft files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: large-edit-draft-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.DRAFT_REPORT }}
            ${{ env.DRAFT_SCREENSHOT }}
          if-no-files-found: error
          retention-days: 30
