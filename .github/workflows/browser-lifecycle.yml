name: Physical model browser lifecycle gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-browser-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_NAME: browser-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Check gate failure cases and fixture/export contract
        run: node --test test/browser-lifecycle.test.mjs test/physical-fixture.test.mjs test/custom-export.test.mjs
      - run: node scripts/install-browser.mjs
      - name: Eight real File/download/reopen/close cycles without forced GC
        run: LIFECYCLE_REPORT="$RUNNER_TEMP/$REPORT_NAME" node test/browser/model-lifecycle.mjs
      - name: Retain bounded metadata and failures, never model files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-lifecycle-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.REPORT_NAME }}
          if-no-files-found: error
          retention-days: 30
